<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a66c2" />
    <meta name="description" content="Gavin Ouyang works across international business operations, project coordination, commercial analysis, digital growth, and AI-enabled workflows." />
    <meta property="og:title" content="Gavin Ouyang — Cross-border Operations & Growth" />
    <meta property="og:description" content="Connecting markets, people and execution." />
    <meta property="og:type" content="website" />
    <title>Gavin Ouyang — Cross-border Operations & Growth</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Person","name":"Gavin Ouyang","alternateName":"歐陽高原","alumniOf":[{"@type":"CollegeOrUniversity","name":"The Hong Kong Polytechnic University"},{"@type":"CollegeOrUniversity","name":"Changsha University of Science & Technology"}],"worksFor":{"@type":"Organization","name":"Xiaomi"}}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" data-header>
      <a href="#top" class="brand" aria-label="Gavin Ouyang — Home">
        <span class="brand-mark">GO</span><span class="brand-name">Gavin Ouyang</span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span class="sr-only">Menu</span></button>
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation"></nav>
      <div class="language-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <span>/</span>
        <button type="button" data-lang="zh-Hant" aria-pressed="false">繁</button>
        <span>/</span>
        <button type="button" data-lang="zh-CN" aria-pressed="false">简</button>
      </div>
    </header>

    <main id="main">
      <section class="hero" id="top" aria-labelledby="hero-title">
        <div class="hero-banner" aria-hidden="true"></div>
        <div class="hero-copy reveal">
          <p class="eyebrow" data-text="hero.eyebrow"></p>
          <h1 id="hero-title" data-text="hero.name"></h1>
          <p class="hero-roles" data-text="hero.roles"></p>
          <p class="hero-intro" data-text="hero.intro"></p>
          <div class="hero-actions">
            <a class="button button-primary magnetic" href="#work"><span data-text="hero.workCta"></span><span aria-hidden="true">↘</span></a>
            <a class="button button-text" href="#contact"><span data-text="hero.contactCta"></span><span aria-hidden="true">→</span></a>
          </div>
        </div>
        <div class="hero-status reveal" data-delay="1"><span class="status-dot"></span><span data-text="hero.status"></span></div>
      </section>

      <section class="section section-about" id="about" aria-labelledby="about-title">
        <div class="section-index reveal" data-text="about.index"></div>
        <div class="about-grid">
          <h2 id="about-title" class="sr-only" data-text="about.heading"></h2>
          <figure class="profile-photo reveal">
            <img src="./assets/gavin-ouyang-portrait.png" alt="Gavin Ouyang" decoding="async" />
          </figure>
          <div class="about-body reveal" data-delay="1" data-rich="about.body"></div>
          <aside class="method-note reveal" data-delay="2">
            <span data-text="about.noteTitle"></span><p data-text="about.note"></p>
          </aside>
        </div>
      </section>

      <section class="section section-capabilities" id="capabilities" aria-labelledby="capabilities-title">
        <div class="section-heading reveal">
          <div class="section-index" data-text="capabilities.index"></div>
          <h2 id="capabilities-title" data-text="capabilities.title"></h2>
          <p data-text="capabilities.intro"></p>
        </div>
        <div class="capability-grid" data-capabilities></div>
      </section>

      <section class="section section-experience" id="experience" aria-labelledby="experience-title">
        <div class="section-heading split reveal">
          <div class="section-index" data-text="experience.index"></div>
          <h2 id="experience-title" data-text="experience.title"></h2>
        </div>
        <div class="timeline" data-experience></div>
      </section>

      <section class="section section-work" id="work" aria-labelledby="work-title">
        <div class="section-heading work-heading reveal">
          <div class="section-index" data-text="work.index"></div>
          <h2 id="work-title" data-text="work.title"></h2>
          <p data-text="work.intro"></p>
        </div>
        <div class="case-grid" data-cases></div>
      </section>

      <section class="section section-education" id="education" aria-labelledby="education-title">
        <div class="section-heading split reveal">
          <div class="section-index" data-text="education.index"></div>
          <h2 id="education-title" data-text="education.title"></h2>
        </div>
        <div class="education-grid" data-education></div>
      </section>

      <section class="section section-contact" id="contact" aria-labelledby="contact-title">
        <div class="contact-copy reveal">
          <div class="section-index" data-text="contact.index"></div>
          <h2 id="contact-title" data-text="contact.title"></h2>
          <p data-text="contact.body"></p>
        </div>
        <div class="contact-panel reveal" data-delay="1">
          <p class="contact-prompt" data-text="contact.prompt"></p>
          <div class="contact-links" data-contact-links></div>
          <a class="back-top" href="#top"><span data-text="contact.back"></span><span aria-hidden="true">↑</span></a>
        </div>
      </section>
    </main>

    <footer><p>© <span data-year></span> Gavin Ouyang</p><p data-text="footer"></p></footer>
    <dialog class="case-dialog" data-dialog aria-labelledby="dialog-title">
      <div class="dialog-shell"><button type="button" class="dialog-close" data-dialog-close aria-label="Close">×</button><div data-dialog-content></div></div>
    </dialog>
    <noscript><div class="noscript">This portfolio requires JavaScript for multilingual content and interactive case studies.</div></noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
